<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mano</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2712%27 fill=%27%232B4FD8%27/%3E%3Cpath d=%27M10 35V19a5.5 5.5 0 0 1 11 0v16M21 19a5.5 5.5 0 0 1 11 0v16%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2739%27 cy=%2732%27 r=%273.2%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: a demo stage (toolbar + device frame) holding one app; the app reflows between phone and desktop with container queries. */
:root{
  --ink:#1A1A1F; --ink-2:#3D3D45; --muted:#6B6B76; --line:#E7E7EC; --line-2:#F1F1F4;
  --paper:#F7F7F8; --surface:#FFFFFF;
  --cobalt:#2B4FD8; --cobalt-2:#1F3DB0; --cobalt-soft:#E8EDFB;
  --deep:#1F2757; --deep-2:#2A3470; --on-deep:#fff; --on-deep-2:#C9D0F2; --sun:#AFC0FA; --sun-soft:#F4F4F6;
  --ok:#1F7A4D; --ok-soft:#EBF6EF;
  --warn:#9A5B00; --warn-soft:#FFF5E6;
  --cert:#3D3D45; --cert-soft:#F1F1F4;
  --bad:#C0312B; --bad-soft:#FDECEA;
  --f-display:"Onest", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Onest", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r-s:10px; --r-m:14px; --r-l:18px;
  --shadow:0 1px 2px rgba(26,26,31,.04), 0 4px 14px rgba(26,26,31,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

/* ---------- Demo stage ---------- */
.demo-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--deep);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--deep)}
.demo-brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.demo-brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.demo-brand span{font-size:12px;color:#B9BDDA;letter-spacing:.04em;text-transform:uppercase}
.demo-group{display:flex;align-items:center;gap:8px}
.demo-group>label{font-size:12px;color:#B9BDDA;letter-spacing:.04em;text-transform:uppercase}
.seg-dark{display:inline-flex;background:#2A2E55;border-radius:999px;padding:3px}
.seg-dark button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:#D7DAF0;display:flex;align-items:center;gap:6px}
.seg-dark button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.try{position:relative}
.try>button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--sun);color:var(--ink);display:flex;gap:6px;align-items:center}
.try-menu{position:absolute;right:0;top:calc(100% + 8px);width:300px;max-width:calc(100vw - 32px);background:#fff;color:var(--ink);border-radius:var(--r-m);box-shadow:0 18px 40px rgba(22,25,58,.25);padding:6px;z-index:70}
.try-menu button{display:block;width:100%;padding:10px 12px;border-radius:10px;font-size:14px}
.try-menu button:hover{background:var(--paper)}
.try-menu small{display:block;color:var(--muted);font-size:12.5px}
.try-menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

.stage{padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;gap:40px;align-items:flex-start}
.stage-note{max-width:300px;padding-top:40px;color:var(--ink-2);font-size:14px}
.stage-note h2{font-size:26px;font-weight:700;margin-bottom:10px}
.stage-note p{margin:0 0 12px}
.stage-note .k{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.stage-note .k .ic{color:var(--cobalt);margin-top:2px}
.is-desktop .stage-note{display:none}
#frame{flex:0 1 auto;min-width:0}
.is-desktop #frame{flex:1;width:100%;max-width:1280px}

.phone{width:414px;height:868px;flex:none;border-radius:58px;background:#0F1129;padding:12px;box-shadow:0 30px 60px rgba(22,25,58,.22),inset 0 0 0 2px #2A2E55;position:relative;transform-origin:top left}
.phone .screen{height:100%;border-radius:46px;overflow:hidden;background:var(--paper);position:relative}
.island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#0F1129;z-index:90}
.homebar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#16193A;z-index:90}
.browser{width:100%;height:min(820px,calc(100vh - 110px));min-height:600px;border-radius:14px;background:#fff;box-shadow:0 30px 60px rgba(22,25,58,.18);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.browser .chrome{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:#ECEEF5;border-bottom:1px solid var(--line)}
.browser .chrome i{width:11px;height:11px;border-radius:50%;background:#CDD0DE;display:block}
.browser .chrome .url{margin-left:14px;flex:1;max-width:460px;background:#fff;border-radius:8px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.browser .screen{flex:1;min-height:0;position:relative;background:var(--paper)}

/* ---------- App shell ---------- */
.app{container-type:inline-size;container-name:app;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.wrap{padding:0 18px}
.statusbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 40px;font-size:15px;font-weight:700;background:var(--surface)}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--line-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.xbtn:hover{background:var(--line)}
.statusbar .dots i{width:16px;height:9px;border-radius:2px;border:1.5px solid var(--ink);display:block}
.is-desktop .statusbar{display:none}

.wordmark{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.03em;display:flex;align-items:center;gap:6px;color:var(--ink)}
.wordmark .mark{flex:none;display:block}
.wordmark .o{width:.62em;height:.62em;border-radius:50%;background:var(--sun);display:inline-block;margin-left:2px;margin-top:.12em;box-shadow:inset 0 0 0 .14em var(--ink)}
.wordmark small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--line-2)}

.apphead{flex:none;display:flex;align-items:center;gap:12px;padding:8px 18px 12px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.apphead .sp{flex:1}
.loc{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--paper);padding:6px 10px;border-radius:999px;max-width:190px}
.loc:hover{background:var(--line-2)}
.loc .ic:last-child{color:var(--muted)}
.topnav{display:none;gap:4px}
.topnav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14px}
.topnav button[aria-current="page"]{background:var(--cobalt-soft);color:var(--cobalt-2)}

.tabbar{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 30px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px}
.tabbar button[aria-current="page"]{color:var(--cobalt)}
.tabbar .badge{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center}
.tabbar .tb{position:relative;display:flex;flex-direction:column;align-items:center}

/* ---------- Common bits ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;font-weight:700;font-size:15px;text-align:center;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--cobalt);color:#fff}
.btn-primary:hover{background:var(--cobalt-2)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#C9CCE0}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 13px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{color:var(--cobalt-2);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap}
.lbl-open{background:var(--ok-soft);color:var(--ok)}
.lbl-intro{background:var(--warn-soft);color:var(--warn)}
.lbl-cert{background:var(--cert-soft);color:var(--cert)}
.lbl-req{background:var(--line-2);color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--line-2);color:var(--muted)} .p-blue{background:var(--cobalt-soft);color:var(--cobalt-2)} .p-cert{background:var(--cert-soft);color:var(--cert)}

.metro{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.metro .ln{font-style:normal;display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 5px;border-radius:11px;color:#fff;font-size:11.5px;font-weight:700;font-family:var(--f-body)}
.metro .m{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}

.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--ink-2);font-size:13.5px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .ic{color:var(--muted)}

.section{padding:18px 0;border-top:1px solid var(--line)}
.section h2{font-size:18px;font-weight:700;margin-bottom:10px}
.section p{margin:0 0 8px}
.ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ul li{display:flex;gap:10px;align-items:flex-start}
.ul li .ic{color:var(--cobalt);margin-top:1px}

.field{display:grid;gap:6px}
.field label,.field .lab{font-size:13.5px;font-weight:700}
.field .hint{font-size:12.5px;color:var(--muted)}
.input{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.field.err .input{border-color:var(--bad)}
.errmsg{display:flex;gap:6px;align-items:flex-start;color:var(--bad);font-size:13px;font-weight:600}
.errmsg .ic{margin-top:1px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:40;background:var(--deep);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(22,25,58,.3)}
.toast.in{animation:toastIn .25s ease}
.toast .ic{color:var(--sun)}
.toast i{background:var(--sun)!important}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--cobalt-soft);color:var(--cobalt-2);font-family:var(--f-display)}
.avatar.lg{width:56px;height:56px;font-size:19px}
.avatar.sun{background:var(--sun-soft);color:#7A5300}

/* ---------- Discover ---------- */
.hello{padding:18px 18px 6px}
.hello h1{font-size:30px;line-height:1.05;font-weight:700;margin-top:6px}
.hello h1 em{font-style:normal;color:var(--cobalt)}
.when{display:flex;gap:6px;padding:14px 18px 4px}
.when button{flex:1;padding:10px 6px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px;text-align:center}
.when button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.when button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.when button[aria-pressed="true"] small{color:#C9CCE6}
.causes{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
.causes::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt-2)}
.resbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;gap:10px}
.resbar h2{font-size:17px;font-weight:700}
.lt-toggle{display:inline-flex;background:var(--line-2);border-radius:999px;padding:3px}
.lt-toggle button{display:flex;gap:5px;align-items:center;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.lt-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,25,58,.12)}
.disc-grid{padding:0 18px 24px}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:88px 1fr;gap:0;background:var(--surface);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);width:100%;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#C9CCE0;box-shadow:0 6px 18px rgba(22,25,58,.07)}
.art{background:var(--tint);color:var(--tone);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;text-align:center}
.art span{font-size:10.5px;font-weight:700;line-height:1.15}
.card .body{padding:12px 14px 13px;display:grid;gap:5px;min-width:0}
.card .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{font-size:16.5px;font-weight:700;line-height:1.2}
.card .org{font-size:13px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spots{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.spots.low{color:var(--bad)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r-l);padding:26px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}

.backup{margin:12px 18px 0;background:var(--deep);color:#fff;border-radius:var(--r-l);padding:14px 16px;display:grid;gap:10px;position:relative;overflow:hidden}
.backup::after{content:"";position:absolute;right:-36px;top:-36px;width:84px;height:84px;border-radius:50%;background:var(--cobalt);opacity:.55}
.backup>*{position:relative;z-index:1}
.backup .top{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sun)}
.backup h3{font-size:18px;font-weight:700;max-width:85%}
.backup p{margin:0;color:var(--on-deep-2);font-size:13.5px}
.backup .live{width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 0 rgba(175,192,250,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(175,192,250,.6)}70%{box-shadow:0 0 0 9px rgba(175,192,250,0)}100%{box-shadow:0 0 0 0 rgba(175,192,250,0)}}

.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap .maplegend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.pinbtn{cursor:pointer}
.pinbtn text{opacity:0;transition:opacity .15s}
.pinbtn:hover text,.pinbtn:focus text{opacity:1}
.pinbtn:hover circle.pc,.pinbtn:focus circle.pc{r:11}

/* ---------- Detail ---------- */
.dhead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px 10px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.dhead .t{flex:1;min-width:0;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.iconbtn:hover{background:var(--paper)}
.detail-grid{padding:0 18px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.dmain{min-width:0}
.dmain>*{min-width:0}
.tiles4>.ft{min-width:0;overflow-wrap:anywhere}
.dtitle h1{overflow-wrap:break-word}
.dhero{background-image:radial-gradient(circle at 2px 2px, rgba(255,255,255,.55) 2px, transparent 0);background-size:22px 22px;margin:14px 0 0;border-radius:var(--r-l);min-height:150px;flex-direction:row;gap:14px;justify-content:flex-start;padding:20px}
.dhero .big{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.dhero span{font-size:13px;text-align:left}
.dtitle{padding:16px 0 14px;display:grid;gap:8px}
.dtitle h1{font-size:28px;line-height:1.08;font-weight:700}
.promise{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.promise .ic{color:var(--ok)}
.promise.req .ic{color:var(--warn)}
.coord{display:flex;gap:12px;align-items:center}
.coord p{margin:0}
.coord .who{font-weight:700}
.coord .role{font-size:13px;color:var(--muted)}
.needbox{border-radius:var(--r-m);padding:14px;display:grid;gap:8px}
.needbox h3{font-size:15.5px;display:flex;gap:8px;align-items:center}
.needbox p{margin:0;font-size:14px}
.needbox.open{background:var(--ok-soft)} .needbox.open h3{color:var(--ok)}
.needbox.intro{background:var(--warn-soft)} .needbox.intro h3{color:var(--warn)}
.needbox.cert{background:var(--cert-soft)} .needbox.cert h3{color:var(--cert)}
.needbox.done{background:var(--ok-soft)} .needbox.done h3{color:var(--ok)}
.bookcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:grid;gap:12px;margin:4px 0 18px}
.bookcard h2{font-size:17px;font-weight:700}
.slotday{display:grid;gap:7px}
.slotday .d{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;gap:1px;min-width:92px}
.slot b{font-size:14.5px}
.slot small{font-size:12px;color:var(--muted);font-weight:600}
.slot[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.slot[aria-pressed="true"] small{color:var(--cobalt-2)}
.slot.full{opacity:.45;cursor:not-allowed}
.bookcard .fine{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.cta-bar{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px 34px;display:flex;align-items:center;gap:12px}
.cta-bar .s{flex:1;min-width:0;font-size:13px;line-height:1.25}
.cta-bar .s b{display:block;font-size:14.5px}

/* ---------- Sheet ---------- */
.backdrop{position:absolute;inset:0;z-index:30;background:rgba(22,25,58,.42);display:flex;align-items:flex-end;justify-content:center}
.backdrop.anim{animation:fade .2s ease}
.backdrop.anim .sheet{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px 36px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.steps{display:flex;gap:5px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--line);display:block}
.steps i.on{background:var(--cobalt)}
.sheet h2{font-size:23px;font-weight:700;line-height:1.12;margin-bottom:6px}
.sheet .lead{color:var(--ink-2);margin:0 0 14px}
.slotstrip{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:var(--r-m);padding:10px 12px;margin-bottom:16px}
.slotstrip .art{width:42px;height:42px;border-radius:12px;padding:0;flex:none}
.slotstrip p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.3}
.slotstrip p b{color:var(--ink);font-size:14px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.past .btn{flex:none}
.agree{border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:grid;gap:8px}
.agree.err{border-color:var(--bad)}
.agree .row{display:flex;gap:12px;align-items:flex-start}
.agree .row .ic{color:var(--cobalt);margin-top:2px}
.agree p{margin:0;font-size:13.5px;color:var(--ink-2)}
.agree ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:3px}
.check{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;padding:6px 0 0}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid #C3C7DC;display:grid;place-items:center;flex:none;color:#fff}
.check[aria-checked="true"] .box{background:var(--cobalt);border-color:var(--cobalt)}
.why{background:var(--cert-soft);border-radius:var(--r-m);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.why b{color:var(--cert)}
.why.intro{background:var(--warn-soft)} .why.intro b{color:var(--warn)}
.optcard{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px 14px;width:100%}
.optcard:hover{border-color:var(--cobalt)}
.optcard .ic{color:var(--cobalt)}
.optcard p{margin:0;font-size:12.5px;color:var(--muted)}
.optcard b{font-size:14.5px}
.spinner{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--cobalt-soft);border-top-color:var(--cobalt);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}
.success-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:4px auto 10px}
.video{border-radius:var(--r-m);background:linear-gradient(135deg,#253099,#16193A);color:#fff;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.video .cap{position:absolute;left:14px;top:12px;font-size:12.5px;font-weight:700;color:#C9CCF2}
.video .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.2)}
.video .bar i{display:block;height:100%;background:var(--sun);width:0;transition:width 2.4s linear}
.video .playbtn{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;color:#fff}

/* ---------- Confirmation ---------- */
.confirm{padding:26px 18px 40px;max-width:640px;margin:0 auto}
.confirm .head{text-align:center;display:grid;gap:6px;justify-items:center;margin-bottom:20px}
.bigcheck{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 10px var(--ok-soft)}
.bigcheck.wait{background:var(--sun);color:var(--ink);box-shadow:0 0 0 10px var(--sun-soft)}
.confirm h1{font-size:30px;font-weight:700;margin-top:12px}
.confirm .sub{color:var(--ink-2);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:grid;gap:12px;margin-bottom:12px}
.panel h3{font-size:16.5px}
.rows{display:grid;gap:10px}
.rows .r{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px}
.rows .r .ic{color:var(--muted);margin-top:1px}
.rows .r b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions3 button,.actions3 a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;text-align:center;color:var(--ink);text-decoration:none}
.actions3 .ic{color:var(--cobalt)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--cobalt-soft);border-radius:var(--r-m);padding:12px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:12px}
.notice .ic{color:var(--cobalt);margin-top:1px}
.notice.sun{background:var(--sun-soft)} .notice.sun .ic{color:#8A5B00}
.release{border:1.5px solid var(--bad-soft);background:#FFF9F8;border-radius:var(--r-m);padding:14px;display:grid;gap:10px}
.release p{margin:0;font-size:14px}

/* ---------- Plans / profile ---------- */
.page{padding:18px 18px 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:820px;width:100%;margin:0 auto}
.page>h1{font-size:28px;font-weight:700}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.plan .art{width:52px;height:52px;border-radius:14px;padding:0}
.plan h3{font-size:16px}
.plan .org{font-size:13px;color:var(--muted);margin:2px 0 6px}
.plan.released{opacity:.6}
.plan>div{min-width:0}
.plan .pill{white-space:normal}
.plan .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.checkin{background:var(--deep);color:#fff;border-radius:var(--r-l);padding:16px;display:grid;gap:10px}
.checkin .top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--sun);text-transform:uppercase;letter-spacing:.06em}
.checkin h3{font-size:19px}
.checkin p{margin:0;color:var(--on-deep-2);font-size:13.5px}
.checkin .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checkin .btn-ghost{background:transparent;color:#fff;border-color:#5B67A8}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:grid;gap:12px}
.fb .q{display:grid;gap:7px}
.fb .q>b{font-size:14px}
.yn{display:flex;gap:8px}
.yn button{flex:1;padding:9px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;text-align:center}
.yn button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt-2)}
textarea.input{min-height:70px;resize:vertical}
.subh{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 -4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;text-align:center}
.fact b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.fact span{font-size:12.5px;color:var(--muted);font-weight:600}
.once{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.once .r{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line-2)}
.once .r:first-child{border-top:0}
.once .r .t{flex:1;min-width:0}
.once .r .t b{display:block;font-size:14.5px}
.once .r .t span{font-size:12.5px;color:var(--muted)}
.once .r>.ic{color:var(--cobalt)}
.perk{display:grid;gap:6px;padding:13px 14px;border-top:1px solid var(--line-2)}
.perk:first-child{border-top:0}
.perk .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.perk .top span{color:var(--muted);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:4px}
.thank{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-2);font-size:14px}
.thank:first-child{border-top:0}
.thank .ic{color:#D4457A}
.seen{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);padding:12px 14px;background:var(--line-2);border-radius:var(--r-m)}
.seen .ic{color:var(--ink-2);margin-top:1px}

/* ---------- Organization ---------- */
.org-shell{flex:1;min-height:0;display:flex;flex-direction:column}
.org-side{display:none}
.org-main{flex:1;min-height:0;display:flex;flex-direction:column}
.orghead{flex:none;display:flex;align-items:center;gap:10px;padding:8px 18px 12px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.orghead .who{flex:1;min-width:0}
.orghead .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orghead .who span{font-size:12.5px;color:var(--muted)}
.alert{display:grid;gap:10px;background:var(--sun-soft);border:1.5px solid #F5D78A;border-radius:var(--r-l);padding:14px 16px}
.alert .top{display:flex;gap:8px;align-items:center;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7A5300}
.alert h3{font-size:17px}
.alert p{margin:0;font-size:13.5px;color:var(--ink-2)}
.oslot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;display:grid;gap:9px;width:100%}
.oslot:hover{border-color:#C9CCE0}
.oslot .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oslot h3{font-size:16px}
.oslot .when2{font-size:13px;color:var(--muted);font-weight:600}
.fill{display:grid;gap:5px}
.fill .nums{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fillbar{height:9px;border-radius:5px;background:var(--line-2);position:relative;overflow:hidden;display:flex}
.fillbar i{display:block;height:100%}
.fillbar .c{background:var(--ok)} .fillbar .n{background:#9EC9B2} .fillbar .pd{background:var(--sun)}
.fillbar .need{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.kpi span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.kpi.warn{background:var(--sun-soft);border-color:#F5D78A}
.people{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.person{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px 10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2)}
.person .ac{grid-column:2}
.person .ac:empty{display:none}
.person:first-child{border-top:0}
.person .nm{font-weight:700;font-size:14.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.person .fx{font-size:12.5px;color:var(--muted)}
.person .ac{display:flex;gap:6px;align-items:center}
.person.dim{opacity:.55}
.tiny{min-height:32px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tiny.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tiny.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.groupt{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--paper);font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.opt-grid{display:grid;gap:8px}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);width:100%}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid #C3C7DC;flex:none;margin-top:1px;display:grid;place-items:center}
.radio[aria-checked="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.radio[aria-checked="true"] .dot{border-color:var(--cobalt)}
.radio[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--cobalt)}
.radio b{display:block;font-size:14.5px}
.radio span{font-size:12.5px;color:var(--muted)}
.stepper{justify-self:start;display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{width:44px;height:44px;display:grid;place-items:center;font-size:20px;font-weight:700}
.stepper output{min-width:46px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.suggest{display:grid;gap:10px;background:var(--cobalt-soft);border-radius:var(--r-m);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.suggest .top{display:flex;gap:8px;align-items:flex-start}
.suggest .top .ic{color:var(--cobalt);margin-top:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.templates{display:flex;gap:6px;flex-wrap:wrap}
.templates button{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.pub-grid{display:grid;gap:16px}
.preview{display:grid;gap:8px}
.preview .eyebrow{display:flex;gap:6px;align-items:center}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.chart h3{font-size:16px;margin-bottom:2px}
.chart p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.chart>svg{width:100%;height:auto;display:block}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;font-size:14px}
.quote span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.ins-grid{display:grid;gap:12px}

/* ---------- V2 components ---------- */
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;background:var(--paper);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag .ic{color:var(--muted)}
.lbl-booked{background:var(--cobalt-soft);color:var(--cobalt-2)}
.tile{width:42px;height:42px;border-radius:12px;background:var(--tint);color:var(--tone);display:grid;place-items:center;flex:none}
.card{display:flex;flex-direction:column;align-items:stretch}
.card .band{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 14px;background:var(--tint);color:var(--tone);font-size:12px;font-weight:700}
.card .band>span{display:flex;gap:6px;align-items:center;min-width:0}
.card .cbody{padding:12px 14px 14px;display:grid;gap:3px;min-width:0;align-content:start;flex:1}
.card h3{font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.causepill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--tone);font-size:12px;font-weight:700;max-width:100%;min-width:0}
.dorg{margin:0;color:var(--muted);font-weight:600;font-size:14.5px}
.tiles4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ft{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;display:grid;gap:4px;min-width:0;align-content:start}
.ft>.ic{color:var(--cobalt)}
.ft b{font-size:15px}
.ft>span{font-size:12.5px;color:var(--muted);font-weight:600}
.reqrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-m)}
.reqrow .ri{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.75);display:grid;place-items:center;flex:none}
.reqrow b{display:block;font-size:14.5px}
.reqrow span{font-size:13px;color:var(--ink-2)}
.reqrow.ok{background:var(--ok-soft)} .reqrow.ok .ri{color:var(--ok)}
.reqrow.warn{background:var(--warn-soft)} .reqrow.warn .ri{color:var(--warn)}
.reqrow.cert{background:var(--cert-soft)} .reqrow.cert .ri{color:var(--cert)}
.ilist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.ilist .r{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-2);color:inherit;text-decoration:none}
.ilist .r:first-child{border-top:0}
.ilist a.r:hover{background:var(--paper)}
.ilist .r>.ic{color:var(--cobalt)}
.ilist .r .t{flex:1;min-width:0}
.ilist .r b{display:block;font-size:14.5px}
.ilist .r .t span{font-size:13px;color:var(--muted)}
.avatar.sm{width:36px;height:36px;font-size:13px}
.slotstrip .tile{width:40px;height:40px}
.slotstrip p{min-width:0}
.agr{border:1.5px solid var(--line);border-radius:var(--r-m);padding:10px 12px;display:grid;gap:6px}
.agr.err{border-color:var(--bad)}
.agr-main{display:flex;gap:12px;align-items:center;width:100%}
.agr-main>.ic{color:var(--cobalt)}
.agr-main .t{flex:1;min-width:0}
.agr-main b{display:block;font-size:14.5px}
.agr-main .t span{font-size:12.5px;color:var(--muted)}
.agr-main .box{width:26px;height:26px;border-radius:8px;border:2px solid #C3C7DC;display:grid;place-items:center;color:#fff;flex:none}
.agr-main[aria-checked="true"] .box{background:var(--cobalt);border-color:var(--cobalt)}
.linkbtn.sm{font-size:13px;justify-self:start}
.agree-pts{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:2px}
.ticket{background:var(--surface);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.tk-top{background:var(--deep);color:#fff;padding:16px 18px;display:grid;gap:3px}
.tk-top span{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sun);text-transform:uppercase}
.tk-top b{font-family:var(--f-display);font-size:34px;line-height:1.05;font-weight:700}
.tk-top small{color:var(--on-deep-2);font-size:13.5px}
.tk-top.wait{background:var(--warn-soft);color:var(--ink)} .tk-top.wait span{color:var(--warn)} .tk-top.wait small{color:var(--ink-2)}
.perf{border-top:2px dashed var(--line);margin:0 14px}
.tk-b{padding:14px 18px 16px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:14px;align-items:baseline}
.kv>span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.remind{display:flex;gap:12px;align-items:center;background:var(--cobalt-soft);border-radius:var(--r-m);padding:12px 14px;margin-bottom:12px}
.remind>.ic{color:var(--cobalt)} .remind b{display:block;font-size:14px} .remind span{font-size:12.5px;color:var(--ink-2)}
.plan2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}

.ask{background:var(--sun-soft);border-top:1px solid #F5D78A;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ask b{margin-right:auto;font-size:14px}
.msg{background:#E5F2E8;border-radius:var(--r-l);padding:12px;display:grid;gap:8px}
.msg-h{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;color:#2D6A3E;text-transform:uppercase;letter-spacing:.05em}

.qr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qr button{background:#fff;border-radius:12px;padding:10px;text-align:center;font-weight:700;color:#1F7A44;font-size:14px}
.fbh{display:flex;gap:10px;align-items:center;min-width:0}
.thankchip{display:flex;gap:8px;align-items:center;background:#FDEEF4;border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600}
.thankchip .ic{color:#D4457A}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qrow b{font-size:14px}
.qrow .yn{flex:none} .qrow .yn button{flex:none;padding:7px 16px}
.hintline{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.oh1{font-size:26px;font-weight:700;margin-top:4px}
.past{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:flex;gap:12px;align-items:center}
.past .t{flex:1;min-width:0} .past b{display:block;font-size:14.5px} .past .t span{font-size:12.5px;color:var(--muted)}
.wiz{display:flex;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.wiz span{flex:1;padding-top:7px;border-top:3px solid var(--line)}
.wiz .on{border-color:var(--cobalt);color:var(--cobalt-2)} .wiz .done{border-color:var(--ok);color:var(--ok)}
.wiznav{display:flex;gap:8px;margin-top:6px}
.wiznav .btn{flex:1}
.dayseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dayseg button{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-weight:700;font-size:13.5px;background:var(--surface)}
.dayseg button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt-2)}
.small{font-size:13px;color:var(--muted)}


/* ---------- Round 2 ---------- */
.plan2{position:relative;overflow:visible}
.plan2 .pc-main{display:flex;gap:8px;align-items:flex-start;padding:14px 10px 13px 14px}
.plan2 .pc-t{flex:1;min-width:0;display:grid;gap:3px;text-align:left}
.plan2 .pc-t h3{font-size:16px;margin-top:6px}

.morebtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.morebtn:hover,.morebtn[aria-expanded="true"]{background:var(--line-2)}
.pmenu{position:absolute;right:10px;top:54px;z-index:15;background:var(--surface);border-radius:14px;box-shadow:0 16px 34px rgba(22,25,58,.22);padding:6px;width:210px;display:grid}
.pmenu button,.pmenu a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.pmenu button:hover,.pmenu a:hover{background:var(--paper)}
.pmenu .ic{color:var(--muted)} .pmenu .red,.pmenu .red .ic{color:var(--bad)}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.cancelask{border-top:1px solid var(--bad-soft);background:#FFF8F7;padding:12px 14px;display:grid;gap:8px;font-size:13.5px}
.seg3{display:grid;grid-template-columns:1fr 1fr;background:var(--line-2);border-radius:12px;padding:3px}
.seg3 button{padding:9px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13.5px;text-align:center}
.seg3 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,25,58,.1)}
.ol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.olr{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line-2);min-height:46px;font-size:14px;width:100%;text-align:left}
.olr:first-child{border-top:0}
button.olr:hover{background:var(--paper)}
.olr b{flex:1;min-width:0;font-size:14.5px}
.olr.on{background:var(--ok-soft)}
.cbx{width:24px;height:24px;border-radius:7px;border:2px solid #C3C7DC;display:grid;place-items:center;color:#fff;flex:none}
.on .cbx{background:var(--ok);border-color:var(--ok)}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle}
.toast .undo{margin-left:8px;color:var(--sun);font-weight:700;white-space:nowrap}
.toast{pointer-events:auto}

/* ---------- Desktop layout (container width) ---------- */

  .org-side nav button[aria-current="page"]{background:var(--cobalt-soft);color:var(--cobalt-2)}

  .pub-grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}

}
@container app (max-width: 859px){
  .kpis.k4{grid-template-columns:1fr 1fr}

}

/* ===================== V3 skin: Friendly & rounded, minimal colour ===================== */

/* ---------- Causes + tags ---------- */
.card .band .more{flex:none;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.ctag{max-width:150px}
.ctag .ell{display:block}
.causegrid{display:flex;flex-wrap:wrap;gap:6px}
.mainb{font-size:10.5px;font-weight:600;background:rgba(255,255,255,.22);padding:1px 6px;border-radius:999px;margin-left:2px}
.tagchip{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 11px;border-radius:999px;background:var(--line-2);font-size:13px;font-weight:600}
.tagchip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.tagchip button:hover{background:var(--line)}
.tagin{display:flex;gap:8px;align-items:center;position:relative}
.tagin .input{flex:1;min-width:0;padding-right:54px}
.tagin .cnt{position:absolute;right:82px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}

/* ---------- Date + time pickers ---------- */
.dayquick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dayquick button{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-weight:600;font-size:14px;background:var(--surface)}
.dayquick small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dayquick button[aria-pressed="true"]{border-color:var(--ink);background:var(--line-2)}
.dayquick button:disabled{opacity:.4;cursor:default}
.cal{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:10px 12px 12px}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calh b{font-size:15px;font-weight:600}
.xbtn:disabled{opacity:.3;cursor:default}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;justify-items:center}
.calg .wd{font-size:11.5px;color:var(--muted);font-weight:600;padding:2px 0 4px}

.cd:hover:not(:disabled){background:var(--line-2)}
.cd:disabled{color:#C3C3CC;cursor:default}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--line)}
.cd[aria-pressed="true"]{background:var(--deep);color:#fff}

.calk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.calk i{width:5px;height:5px;border-radius:50%;background:var(--cobalt)}
.timerow{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none;scroll-behavior:smooth;align-items:center}
.timerow::-webkit-scrollbar{display:none}
.tper{flex:none;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 2px 0 6px}
.tper:first-child{padding-left:0}
.tchip{flex:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;background:var(--surface);font-variant-numeric:tabular-nums}
.tchip[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.tchip:disabled{opacity:.35;cursor:default}
.durs{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- Org slot cards: seats ---------- */
.oslot{gap:10px}
.oslot .top>div{min-width:0}
.seats{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.seats i{width:16px;height:16px;border-radius:50%;border:1.5px solid #C9C9D1;flex:none}

.seats .extra{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.oc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.oc-small{font-size:13px;color:var(--muted)} .oc-small b{color:var(--ink);font-weight:600}

.ost-warn{background:var(--warn-soft);color:var(--warn)} .ost-mute{background:var(--line-2);color:var(--ink-2)} .ost-ok{background:var(--ok-soft);color:var(--ok)}
.seatkey{gap:14px;margin-top:-4px}
.seatkey span{display:inline-flex;gap:6px;align-items:center}
.sk{width:10px;height:10px;border-radius:50%;border:1.5px solid #C9C9D1;display:inline-block}
.sk.on{background:#C9C9D1} .sk.pend{border-style:dashed;border-color:var(--warn)} .sk.conf{background:var(--ink-2);border-color:var(--ink-2)}

/* ---------- Covers (D) ---------- */
.mono{border-radius:50%;background:var(--mc);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none;letter-spacing:-.02em}
.cardd{padding:0}
.cardd .cv{position:relative;height:104px;background:var(--line-2)}
.cardd .cv>svg,.cardd .cv>img,.dcover>svg,.dcover>img,.pthumb>svg,.pthumb>img,.covopt>svg,.covopt>img{display:block;width:100%;height:100%;object-fit:cover}
.cardd .cv>svg,.cardd .cv>img{border-radius:var(--r-l) var(--r-l) 0 0}
.cvchip{position:absolute;left:10px;top:10px;display:inline-flex;gap:5px;align-items:center;max-width:70%;padding:4px 9px 4px 7px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--ink-2);font-size:12px;font-weight:600}
.cvchip .more{font-size:11px;background:var(--line-2);border-radius:999px;padding:0 5px}
.cardd .cv .mono{position:absolute;left:14px;bottom:-17px;box-shadow:0 0 0 3px var(--surface)}
.cardd .cbody{padding:22px 14px 14px;gap:4px}
.times{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.tday{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:2px}
.tm{font-size:13px;font-weight:600;padding:4px 9px;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--ink)}
.tm.fullc{color:var(--muted);border-style:dashed}
.tm.low{color:var(--bad);border-color:#F3C9C5}
.tm.more{color:var(--muted)}
.cardd .row{margin-top:4px}
.dcover{position:relative;height:190px;margin:0 -18px 8px;overflow:visible}

.dcover .mono{position:absolute;left:16px;bottom:-20px;box-shadow:0 0 0 4px var(--paper)}
.dcover+.dtitle{padding-top:26px}
.pthumb{width:56px;height:42px;border-radius:10px;overflow:hidden;flex:none;display:block}
.covgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.covopt{position:relative;aspect-ratio:16/7;border-radius:12px;overflow:hidden;border:2px solid transparent;display:grid;place-items:center;background:var(--line-2);cursor:pointer;padding:0}
.covopt[aria-pressed="true"],.covopt.on{border-color:var(--ink)}
.covopt[aria-pressed="true"]::after,.covopt.on::after{content:"✓";position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--deep);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:700}

.covopt.up>svg{width:22px;height:22px}
.covopt.up{border:1.5px dashed #C3C3CC;color:var(--ink-2);font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.covopt.up.on{border-style:solid}
@container app (min-width: 860px){ .cardd .cv{height:120px} .dcover{height:240px;margin:16px 0 8px} .dcover>svg,.dcover>img{border-radius:var(--r-l)} .covgrid{grid-template-columns:repeat(4,1fr)} }
.mrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ft .mrow .metro{font-size:12.5px}

.vidup{display:flex;gap:10px;align-items:center;border:1.5px dashed #C3C3CC;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface);min-width:0}
.vidup .ell{flex:1}
textarea.input{line-height:1.4}

/* one Book button per screen size: footer on phones, side card on desktop */
.bookcard .bc-btn{display:none}
@container app (min-width: 860px){ .bookcard .bc-btn{display:block} }

/* KPI cards: number + delta chip (V4.10) */
.ohello{font-size:19px;line-height:1.25;font-weight:600;margin:0}
.kpi .kv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.kpi .kv b{font-size:26px;line-height:1}
.kpi .kv b i{font-style:normal;color:var(--muted);font-size:.62em;font-weight:600}
.kpi>span{font-size:12.5px;font-weight:600}
.kpi .kv .delta{display:inline-flex;align-items:center;gap:2px;font-size:13.5px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;white-space:nowrap;text-transform:none;letter-spacing:0;margin:0}
.kpi .kv .delta.down{color:var(--bad)}
.kpi .kv .delta .ic{flex:none}
@container app (min-width: 860px){ .ohello{font-size:24px} .kpi .kv b{font-size:30px} }

/* Insights period filter (V4.11) */
.inshead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chart .legend{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 0}
.chart .legend i{width:16px;border-top:1.5px dashed #8E8E99}
.segp{display:inline-flex;flex:none;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.segp button{padding:6px 9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.segp button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(22,25,58,.12)}
@container app (min-width: 860px){ .segp button{padding:7px 14px} }

/* Insights: plan + learn (V4.12) */
.chart{display:flex;flex-direction:column;gap:10px}
.chart>p{margin:-6px 0 0}
.fills,.fixes{display:flex;flex-direction:column}
.fr,.fx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
.fr:first-child,.fx:first-child{border-top:0;padding-top:2px}
.fr .t,.fx .t{flex:1;min-width:0;display:flex;flex-direction:column}
.fr .t b,.fx .t b{font-size:14px;font-weight:600}
.fr .t span,.fx .t span{font-size:12.5px;color:var(--muted)}
.fx.done .t b{color:var(--muted);text-decoration:line-through}
.leadh{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:96px;align-items:end}
.lb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.lb i{display:block;width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:#C9C9D1}
.lb.pk i{background:#3D3D45}
.lb span{font-size:11px;color:var(--muted);font-weight:600}
.chart .hintline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);margin:0}
.avs{display:flex;padding-left:8px}
.avs .avatar{width:38px;height:38px;margin-left:-5px;box-shadow:0 0 0 2.5px var(--surface);font-size:12.5px}
.avs .avatar.more{background:var(--line-2);color:var(--muted)}
.gobk{display:flex;align-items:baseline;gap:6px;padding-top:8px;border-top:1px solid var(--line-2)}
.gobk b{font-size:20px;font-weight:700}
.gobk span{font-size:13px;color:var(--muted)}
.chart .btn{align-self:flex-start}

/* Feedback: AI summary + action items + all comments (V4.13) */
.aisum{display:flex;gap:10px;align-items:flex-start;background:var(--line-2);border-radius:12px;padding:10px 12px}
.aisum>.ic{flex:none;margin-top:2px;color:var(--ink-2)}
.aisum>div{flex:1;min-width:0}
.aisum .lbl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.chart .aisum p,.aisum p{margin:2px 0 0;font-size:14px;color:var(--ink);line-height:1.4}
.aisum .btn{align-self:center;flex:none}
.lnk{font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;padding:0;align-self:flex-start;font-weight:500}
.cmchips{display:flex;gap:6px;flex-wrap:wrap}
.cmchips .chip .n{font-size:11.5px;color:var(--muted);margin-left:4px;font-weight:600}
.cmchips .chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.cmt{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:12px 14px}
.cmt p{margin:0;font-size:14.5px;line-height:1.4}
.cmt .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}

/* Settings + integrations (V4.14) */
.ohead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gearbtn{padding:6px;border-radius:50%}
.side-bottom{margin-top:auto}

.intc .ih .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

.intc .ih .t span{font-size:13px;color:var(--muted);line-height:1.35}
.ilogo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--line-2);color:var(--ink-2)}
.ilogo.wa{background:#E7F5EC;color:#1F7A4D}
.ilogo.gc{background:#E8EEFB;color:#2F5BB7}
.intc .opts{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14px;font-weight:500;text-align:left;width:100%}
.sw{width:40px;height:24px;border-radius:999px;background:#D5D5DC;position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.swrow[aria-checked="true"] .sw{background:var(--cobalt)}
.swrow[aria-checked="true"] .sw i{transform:translateX(16px)}
.intc .lnk{color:var(--muted)}
.dhead .iconbtn+.t+.iconbtn{margin-left:auto}
@container app (min-width: 860px){ .gearbtn{display:none} }
@container app (max-width: 859px){ .hide-s{display:none} }

/* Edge cases (V4.15) */
.try-menu{max-height:min(560px,calc(100vh - 90px));overflow:auto}
.try-menu .tmh{margin:6px 12px 2px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.success-ic.warnic{background:var(--warn-soft);color:var(--warn)}
.altrow{display:flex;gap:8px;flex-wrap:wrap}
.altrow .slot{flex:1 1 120px}
.clashbar{display:flex;align-items:center;gap:6px;justify-content:center;font-size:13px;font-weight:600;color:var(--bad);padding:2px 0}
.slotstrip .pill{flex:none;margin-left:auto}
.pnote{display:flex;gap:8px;align-items:flex-start;padding:0 14px 12px;font-size:13px;color:var(--ink-2);line-height:1.35}

.pquote{margin:0 14px 12px;padding:10px 12px;border-radius:12px;background:var(--line-2)}

.sugg{display:flex;flex-direction:column;gap:6px;padding:0 14px 14px}

.sg{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}

.sg .t span{font-size:12.5px;color:var(--muted)}
.pchange{display:flex;align-items:center;gap:8px;padding:0 14px 12px;font-size:14px}

.cancelask.late,.release.late{background:var(--warn-soft)}

.oslot.cancelled{opacity:.7;cursor:default}
.oslot.cancelled h3{text-decoration:line-through}
.notice.nbtn{width:100%;text-align:left;cursor:pointer}
.notice.nbtn>span{flex:1}

/* Series (V4.16): the next date is the full card, the rest hang off the bottom */
.oslot.ser{padding:0;gap:0;cursor:default}

.stail:hover{background:var(--paper)}
.stail>.ic{flex:none;color:var(--muted)}

.srow b{font-weight:600;min-width:78px;white-space:nowrap}
.srow .n{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .ost{font-size:11.5px}
.srow.off{opacity:.55}
.srow.off b{text-decoration:line-through}
.seriespill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.repn{display:flex;flex-wrap:wrap;gap:6px}
.repsum{display:flex;gap:8px;align-items:flex-start;background:var(--line-2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.repsum .ic{flex:none;margin-top:1px;color:var(--ink-2)}
.repsum b{color:var(--ink);font-weight:600}
/* One-off activity: no picker on phones, a small "When" card on desktop */
.whenrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600}
.whenrow .ic{color:var(--ink-2)}
.whenrow .sp{color:var(--muted);font-weight:500}
.bookcard.once{display:none}
.moredates{justify-self:start}
@container app (min-width: 860px){ .bookcard.once{display:grid} }

function clashSheet(){
  const c=S.clash; const old=S.bookings.find(x=>x.id===c.bid); const oo=opp(old.oppId), os=oo.slots[old.slotIdx]; const no=opp(c.oppId), ns=no.slots[c.idx];
  const [a,b]=slotRange(os), [x,y]=slotRange(ns); const f=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  const row=(o,sl,tag)=>`<div class="slotstrip"><div class="tile" ${art(o)}>${ic(CAUSES[o.causes[0]].icon,20)}</div><p><b class="ell" style="display:block">${esc(o.title)}</b>${DAYS[sl.d].short} · ${sl.t}–${sl.e}</p>${tag}</div>`;
  return `<div class="backdrop ${c.anim?'anim':''}" data-a="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="Time clash"><div class="grab"></div>
    <div class="sheet-head"><h2 style="margin:0">Times overlap</h2><button class="xbtn" data-a="clashclose" aria-label="Close" title="Close">${ic('x',20,2.2)}</button></div>
    <div class="stack" style="gap:8px">${row(oo,os,`<span class="pill p-blue">${old.status==='requested'?'Requested':'Booked'}</span>`)}
      <div class="clashbar">${ic('alert',15,2.2)}Both run ${f(Math.max(a,x))}–${f(Math.min(b,y))}</div>
      ${row(no,ns,`<span class="pill p-mute">New</span>`)}</div>
    <div class="stack" style="margin-top:14px"><button class="btn btn-primary btn-block" data-a="clashswap">Swap to the new one</button>
      <button class="btn btn-ghost btn-block" data-a="clashclose">Keep my booking</button>
      <p class="small center" style="margin:0">Swapping cancels your other spot once the new one is booked</p></div>
  </div></div>`;
}
function sheetNext(){
  const sh = S.sheet; const o = opp(sh.oppId); const step = sh.steps[sh.k];
  if (step==='details'){
    const e = {};
    if (!S.user.name.trim()) e.name = 'Add your first name';
    const digits = S.user.phone.replace(/\D/g,'');
    if (digits.length < 9) e.phone = 'Add a mobile number (at least 9 digits)';
    if (!S.user.agreement && !sh.agreeTick) e.agree = 'Tick the agreement to continue';
    sh.errors = e;
    if (Object.keys(e).length){ render(); return; }
    S.user.agreement = true; S.user.agreedOn = 'Sat 7 Nov';
  }
  if (step==='cert' && sh.cert!=='done') return;
  if (step==='intro'){ if (sh.intro!=='done') return; if(!S.user.intros.includes(o.id)) S.user.intros.push(o.id); }
  if (sh.k < sh.steps.length-1){ sh.k++; sh.errors={}; render(); return; }
  if (sh.toWait){ sh.full=true; render(); return; }
  // book
  const s = o.slots[sh.slotIdx];
  if (S.raceArmed && sh.oppId===S.raceArmed){ S.raceArmed=null; s.left=0; sh.full=true; sh.anim=false; render(); return; }
  const status = o.mode==='request' ? 'requested' : 'booked';
  const viaBackup = !!(S.backup && S.backup.oppId===o.id && sh.slotIdx===0 && S.backup.left>0);
  const b = {id:'b'+Date.now(), oppId:o.id, slotIdx:sh.slotIdx, status, stillComing:null, viaBackup};
  S.bookings.push(b);
  s.left = Math.max(0, s.left-1);
  if (sh.swapFrom){ const old=S.bookings.find(x=>x.id===sh.swapFrom); if(old && old.status!=='released'){ old.status='released'; opp(old.oppId).slots[old.slotIdx].left++; } S.swapped=old?opp(old.oppId).title:null; }
  if (S.backup && S.backup.oppId===o.id && sh.slotIdx===0) S.backup.left = Math.max(0, S.backup.left-1);
  S.sheet = null;
  S.vscreen = {name:'confirm', bid:b.id};
  render();
  if (S.swapped){ toast(`Swapped. Your ${S.swapped} spot went to the waitlist`,'check'); S.swapped=null; }
}

const counts = sl => { const c={confirmed:0,noreply:0,booked:0,released:0,pending:0,approved:0}; sl.people.forEach(p=>c[p.st]=(c[p.st]||0)+1); return c; };
function orgPeople(sl){

  }); }
  return sl.people.concat(extra);

function slotStats(sl){
  const ppl = orgPeople(sl); const c={confirmed:0,noreply:0,booked:0,released:0,pending:0,approved:0};
  ppl.forEach(p=>c[p.st]++);
  const active = c.confirmed + c.noreply + c.booked + c.approved;
  const expected = Math.round(active * sl.history);
  return {ppl, c, active, expected};
}

}
function seatsHTML(sl, st){

  const extra = Math.max(0, conf + other - n);

function slotStatus(sl, st){
  if (sl.d==='sat' && st.expected < sl.needed) return ['warn', `May be short · ~${st.expected} expected`];
  if (st.c.pending) return ['warn', `${st.c.pending} to approve`];

  return ['ok', 'On track'];
}
/* Series grouping (V4.16): one card per series, showing its next date; the rest go in the tail */
const daysAway = sl => Math.round((isoDate(dayIso(sl.d)) - isoDate(TODAY_ISO)) / 864e5);
function laterNeedsAttention(sl){ if (sl.cancelled) return false; const st = slotStats(sl); return daysAway(sl) <= 7 && st.active < sl.needed/2; }
function groupedSlots(){
  const out = [], seen = {};
  S.orgSlots.forEach(sl => {
    if (!sl.series){ out.push({next:sl, series:null, rest:[]}); return; }
    if (seen[sl.series.id]) return; seen[sl.series.id] = true;
    const all = S.orgSlots.filter(x=>x.series && x.series.id===sl.series.id).sort((a,b)=>dayIso(a.d)<dayIso(b.d)?-1:1);
    const next = all.find(x=>!x.cancelled) || all[0];
    out.push({next, series:sl.series, rest:all.filter(x=>x!==next)});
  });
  return out;
}

function csvDownload(name, rows){
  const csv = rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }).join(',')).join('\n');
  const data = '\ufeff'+csv;
  (async () => {
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads').catch(()=>null) : null;
    if (dl){ try { await dl.save({filename:name, data}); toast(`${name} saved`, 'download'); } catch(e){ if (e && e.code!=='declined') toast('Download isn’t available here', 'info'); } return; }
    try { const url = URL.createObjectURL(new Blob([data], {type:'text/csv'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000); toast(`${name} downloaded`, 'download'); } catch(e){ toast('Download isn’t available here', 'info'); }
  })();
}

function fitPhone(){
  const ph = frame.querySelector('.phone');
  if (!ph || window.innerWidth <= 760){ frame.style.width=''; frame.style.height=''; if(ph) ph.style.transform=''; return; }
  const noteW = window.innerWidth > 760 ? 340 : 0;
  const k = Math.min(1, (window.innerHeight - 96) / 868, (window.innerWidth - 32 - noteW) / 414);
  ph.style.transform = `scale(${k})`; frame.style.width = (414*k)+'px'; frame.style.height = (868*k)+'px';
}

});

frame.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return; const v = e.target.value;
  if (f==='name'){ S.user.name=v; } if (f==='phone'){ S.user.phone=v; }
  if ((f==='name'||f==='phone'||f==='ptitle') && v.trim()){ const fld=e.target.closest('.field'); if(fld && fld.classList.contains('err')){ fld.classList.remove('err'); const m=fld.querySelector('.errmsg'); if(m) m.remove(); if(S.sheet&&S.sheet.errors) delete S.sheet.errors[f]; if(f==='ptitle') delete S.pub.errors.title; } }
  if (f==='fbnote') S.past.feedback.note=v;
  if (f==='locq' && S.locSheet){ S.locSheet.q=v; render(); const i=document.getElementById('loc-q'); if(i){ i.focus(); i.setSelectionRange(v.length, v.length); } }
  if (f==='msgtext' && S.msgSheet){ S.msgSheet.text=v; if(v.trim() && S.msgSheet.err){ S.msgSheet.err=false; const fld=e.target.closest('.field'); fld.classList.remove('err'); const em=fld.querySelector('.errmsg'); if(em) em.remove(); } }
  if (f==='ptitle'){ S.pub.title=v; const t=frame.querySelector('.preview .card h3'); if(t) t.textContent=v||'What volunteers will do'; }
  if (f==='pbring') S.pub.bring=v;
  if (f==='rother' && S.reasonAsk){ S.reasonAsk.other=v; }
  if (f==='wanum' && S.intSheet){ S.intSheet.num=v; if(S.intSheet.err && v.replace(/\D/g,'').length>=9){ S.intSheet.err=false; const fld=e.target.closest('.field'); fld.classList.remove('err'); const em=fld.querySelector('.errmsg'); if(em) em.remove(); } }
  if (f==='pabout'){ S.pub.about=v; const c=frame.querySelector('[data-acnt]'); if(c) c.textContent=v.length; if(v.trim() && S.pub.errors.about){ delete S.pub.errors.about; const fld=e.target.closest('.field'); fld.classList.remove('err'); const m=fld.querySelector('.errmsg'); if(m) m.remove(); } }
  if (f==='paddr'){ S.pub.addr=v; if(v.trim()) delete S.pub.errors.loc; }
  if (f==='pmeet') S.pub.meet=v;
  if (f==='pvname') S.pub.introName=v;
  if (f==='ptag'){ S.pub.tagDraft=v; const c=frame.querySelector('[data-cnt]'); if(c) c.textContent=v.length+'/20'; }

frame.addEventListener('change', e => {
  if (e.target.id==='p-vlen'){ S.pub.introLen=+e.target.value; return; }
  if (e.target.id==='p-video' && e.target.files && e.target.files[0]){ const f=e.target.files[0];
    if (!/^video\//.test(f.type)){ S.pub.errors.intro='Choose a video file (MP4 or MOV)'; render(); return; }

document.addEventListener('click', e => { if (!e.target.closest('.try')) { tryMenu.hidden = true; tryBtn.setAttribute('aria-expanded', false); } });
tryMenu.addEventListener('click', e => {
  const b = e.target.closest('[data-flow]'); if (!b) return; tryMenu.hidden = true; tryBtn.setAttribute('aria-expanded', false);
  const f = b.dataset.flow; S.sheet=null; S.backupAsk=null; S.releaseAsk=null;
  if (f==='reset'){ const v=S.view; OPPS = JSON.parse(OPPS0); PAST.splice(0, PAST.length, ...JSON.parse(PAST0)); S = initialState(); S.view = v; render(); scrollTopNow(); return; }
  if (['today','kids','intro','request','checkin','oneoff','location','missingbook','fullslot'].includes(f)) S.side='vol';
  if (f==='fullslot'){ S.when='tomorrow'; S.vscreen={name:'detail', id:'solidarios', sel:0}; }
  if (f==='missingbook'){ const v=S.view; OPPS = JSON.parse(OPPS0); PAST.splice(0, PAST.length, ...JSON.parse(PAST0)); S = initialState(); S.view=v; const o=opp('avemaria'); S.vscreen={name:'detail', id:'avemaria', sel:0}; S.sheet={oppId:'avemaria', slotIdx:0, k:0, steps:sheetSteps(o), errors:{}, agreeTick:false, anim:false}; sheetNext(); return; }
  if (f==='missingpub'){ S.side='org'; S.oscreen=null; S.otab='publish'; A.blank(); A.pubnext(); return; }
  if (f==='location'){ S.loc=null; S.vscreen=null; S.vtab='discover'; S.locSheet={q:'', anim:true}; }
  if (f==='today'){ S.vscreen={name:'detail', id:'avemaria', sel:null}; }
  if (f==='oneoff'){ S.vscreen={name:'detail', id:'plaza', sel:null}; }
  if (f==='pickdays'){ S.side='org'; S.oscreen=null; S.otab='publish'; A.blank(); Object.assign(S.pub,{title:'Pack Christmas boxes', about:'Pack food boxes for families before the holidays.', date:'2026-11-12', d:dayKey('2026-11-12'), calMonth:{y:2026,m:10}, step:2, rep:'pick', days:['2026-11-12','2026-11-13','2026-11-16','2026-11-28'], needed:10}); }
  if (f==='addslot'){ S.side='org'; S.oscreen=null; S.otab='publish'; A.usepast({i:0}); }
  if (f==='weekly'){ S.side='org'; S.oscreen=null; S.otab='publish'; A.blank(); Object.assign(S.pub,{title:'Pack Christmas boxes', about:'Pack food boxes for families before the holidays.', date:'2026-11-14', d:dayKey('2026-11-14'), calMonth:{y:2026,m:10}, step:2, rep:'weekly', repN:8, needed:10}); }
  if (f==='kids'){ S.vscreen={name:'detail', id:'aladina', sel:null}; }
  if (f==='intro'){ S.vscreen={name:'detail', id:'grandes', sel:null}; }
  if (f==='request'){ S.vscreen={name:'detail', id:'nuevofuturo', sel:null}; }
  if (f==='checkin'){
    if (!S.user.agreement){ S.user.name = S.user.name || 'Alex'; S.user.phone = S.user.phone || '600 123 456'; S.user.agreement = true; S.user.agreedOn='Sat 7 Nov'; }
    if (!S.bookings.some(x=>x.status==='booked' && opp(x.oppId).slots[x.slotIdx].d==='sun' && x.stillComing==null)){ S.bookings.push({id:'b'+Date.now(), oppId:'banco', slotIdx:1, status:'booked', stillComing:null}); opp('banco').slots[1].left--; }
    S.reminder = true; S.vscreen=null; S.vtab='plans';
  }
  const EDGE = ['lastspot','clash','declined','noreply','orgcancel','moved','latecancel','cancelslot','declinereason','edittime'];
  if (EDGE.includes(f)){ const v=S.view; OPPS = JSON.parse(OPPS0); PAST.splice(0, PAST.length, ...JSON.parse(PAST0)); S = initialState(); S.view = v;
    if (f==='edittime'){ S.side='org'; S.user.name='Alex'; S.user.phone='600 123 456'; S.user.agreement=true; S.user.agreedOn='Sat 7 Nov'; S.bookings.push({id:'b'+Math.random().toString(36).slice(2,8), oppId:'banco', slotIdx:3, status:'booked', stillComing:null}); opp('banco').slots[3].left--; S.oscreen={name:'att', sid:'s1-2'}; const sl=S.orgSlots.find(x=>x.id==='s1-2'); S.editAsk={sid:'s1-2', t:sl.t, dur:slotHours(sl), anim:true}; }
    if (f!=='cancelslot' && f!=='declinereason' && f!=='edittime'){ S.side='vol'; S.user.name='Alex'; S.user.phone='600 123 456'; S.user.agreement=true; S.user.agreedOn='Sat 7 Nov'; S.user.certificate=true; }
    const add = (oppId, slotIdx, status, x={}) => { const b={id:'b'+Math.random().toString(36).slice(2,8), oppId, slotIdx, status, stillComing:null, ...x}; S.bookings.push(b); if(status==='booked') opp(oppId).slots[slotIdx].left--; return b; };
    if (f==='lastspot'){ opp('amigos').slots[0].left=1; S.raceArmed='amigos'; S.vscreen={name:'detail', id:'amigos', sel:0}; }
    if (f==='clash'){ add('banco',0,'booked'); S.vscreen={name:'detail', id:'amigos', sel:0}; }
    if (f==='declined'){ add('nuevofuturo',0,'declined',{reason:'Monday is full with our weekly volunteers. Wednesday has room.'}); S.vtab='plans'; }
    if (f==='noreply'){ add('nuevofuturo',1,'expired'); S.vtab='plans'; }
    if (f==='orgcancel'){ add('plaza',0,'orgcancelled',{reason:'Heavy rain forecast, so the garden is closed. Sorry!'}); S.vtab='plans'; }
    if (f==='moved'){ const sl=opp('banco').slots[1]; const b=add('banco',1,'booked',{change:{from:`${sl.t}–${sl.e}`}}); sl.t='11:00'; sl.e='14:00'; S.vtab='plans'; }
    if (f==='latecancel'){ const b=add('banco',0,'booked'); S.vtab='plans'; S.releaseAsk=b.id; }
    if (f==='cancelslot'){ S.side='org'; S.oscreen={name:'att', sid:'s2'}; S.reasonAsk={kind:'cancel', sid:'s2', reason:null, anim:true}; }
    if (f==='declinereason'){ S.side='org'; S.oscreen={name:'att', sid:'s3'}; S.reasonAsk={kind:'decline', sid:'s3', i:1, reason:null, anim:true}; }
    render(); scrollTopNow(); return; }
  if (f==='publish'){ S.side='org'; S.oscreen=null; S.otab='publish'; }
  if (f==='backup'){ S.side='org'; S.oscreen={name:'att', sid:'s1'}; }
  render(); scrollTopNow();
});

render();
})();
</script>
